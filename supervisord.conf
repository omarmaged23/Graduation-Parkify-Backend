[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mqtt-listener]
command=php artisan mqtt:subscribe "garage/spots/request_init"
directory=/app
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/mqtt.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
# Pass all required environment variables
environment=
    APP_ENV="%(ENV_APP_ENV)s",
    APP_DEBUG="%(ENV_APP_DEBUG)s",
    APP_KEY="%(ENV_APP_KEY)s",
    APP_NAME="%(ENV_APP_NAME)s",
    APP_URL="%(ENV_APP_URL)s",
    LOG_CHANNEL="%(ENV_LOG_CHANNEL)s",
    LOG_LEVEL="%(ENV_LOG_LEVEL)s",
    OCTANE_SERVER="%(ENV_OCTANE_SERVER)s",
    DB_CONNECTION="%(ENV_DB_CONNECTION)s",
    DB_HOST="%(ENV_DB_HOST)s",
    DB_PORT="%(ENV_DB_PORT)s",
    DB_DATABASE="%(ENV_DB_DATABASE)s",
    DB_USERNAME="%(ENV_DB_USERNAME)s",
    DB_PASSWORD="%(ENV_DB_PASSWORD)s",
    MQTT_HOST="%(ENV_MQTT_HOST)s",
    MQTT_PORT="%(ENV_MQTT_PORT)s",
    MQTT_CLIENT_ID="%(ENV_MQTT_CLIENT_ID)s",
    MQTT_CLIENT_SUBSCRIBER_ID="%(ENV_MQTT_CLIENT_SUBSCRIBER_ID)s",
    MQTT_USERNAME="%(ENV_MQTT_USERNAME)s",
    MQTT_PASSWORD="%(ENV_MQTT_PASSWORD)s",
    MQTT_KEEP_ALIVE="%(ENV_MQTT_KEEP_ALIVE)s",
    MQTT_CLEAN_START="%(ENV_MQTT_CLEAN_START)s",
    MQTT_TLS="%(ENV_MQTT_TLS)s",

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
