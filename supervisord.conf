[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:frankenphp]
command=php artisan octane:frankenphp --host=0.0.0.0 --port=80
directory=/app
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/frankenphp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=
    APP_ENV="%(ENV_APP_ENV)s",
    APP_DEBUG="%(ENV_APP_DEBUG)s",
    APP_KEY="%(ENV_APP_KEY)s",
    DB_CONNECTION="%(ENV_DB_CONNECTION)s",
    DB_HOST="%(ENV_DB_HOST)s",
    DB_PORT="%(ENV_DB_PORT)s",
    DB_DATABASE="%(ENV_DB_DATABASE)s",
    DB_USERNAME="%(ENV_DB_USERNAME)s",
    DB_PASSWORD="%(ENV_DB_PASSWORD)s"

[program:mqtt-listener]
command=php artisan mqtt:subscribe "garage/spots/request_init"
directory=/app
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/mqtt.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=
    APP_ENV="%(ENV_APP_ENV)s",
    APP_DEBUG="%(ENV_APP_DEBUG)s",
    APP_KEY="%(ENV_APP_KEY)s",
    DB_CONNECTION="%(ENV_DB_CONNECTION)s",
    DB_HOST="%(ENV_DB_HOST)s",
    DB_PORT="%(ENV_DB_PORT)s",
    DB_DATABASE="%(ENV_DB_DATABASE)s",
    DB_USERNAME="%(ENV_DB_USERNAME)s",
    DB_PASSWORD="%(ENV_DB_PASSWORD)s"

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
