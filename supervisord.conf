[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:frankenphp]
command=php artisan octane:frankenphp --host=0.0.0.0 --port=80
directory=/app
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/frankenphp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:mqtt-listener]
command=php artisan mqtt:subscribe "garage/spots/request_init"
directory=/app
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/mqtt.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
