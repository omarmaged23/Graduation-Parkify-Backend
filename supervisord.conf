[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:frankenphp]
command=php artisan octane:frankenphp --host=0.0.0.0 --port=80
directory=/app
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/frankenphp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
# Pass all required environment variables
environment=
    APP_ENV="%(ENV_APP_ENV)s",
    APP_DEBUG="%(ENV_APP_DEBUG)s",
    APP_KEY="%(ENV_APP_KEY)s",
    APP_NAME="%(ENV_APP_NAME)s",
    APP_URL="%(ENV_APP_URL)s",
    LOG_CHANNEL="%(ENV_LOG_CHANNEL)s",
    LOG_LEVEL="%(ENV_LOG_LEVEL)s",
    OCTANE_SERVER="%(ENV_OCTANE_SERVER)s",
    DB_CONNECTION="%(ENV_DB_CONNECTION)s",
    DB_HOST="%(ENV_DB_HOST)s",
    DB_PORT="%(ENV_DB_PORT)s",
    DB_DATABASE="%(ENV_DB_DATABASE)s",
    DB_USERNAME="%(ENV_DB_USERNAME)s",
    DB_PASSWORD="%(ENV_DB_PASSWORD)s",
    MQTT_HOST="%(ENV_MQTT_HOST)s",
    MQTT_PORT="%(ENV_MQTT_PORT)s",
    MQTT_CLIENT_ID="%(ENV_MQTT_CLIENT_ID)s",
    MQTT_CLIENT_SUBSCRIBER_ID="%(ENV_MQTT_CLIENT_SUBSCRIBER_ID)s",
    MQTT_USERNAME="%(ENV_MQTT_USERNAME)s",
    MQTT_PASSWORD="%(ENV_MQTT_PASSWORD)s",
    MQTT_KEEP_ALIVE="%(ENV_MQTT_KEEP_ALIVE)s",
    MQTT_CLEAN_START="%(ENV_MQTT_CLEAN_START)s",
    MQTT_TLS="%(ENV_MQTT_TLS)s",
    PAYMOB_BASE_URL="%(ENV_PAYMOB_BASE_URL)s",
    PAYMOB_API_KEY="%(ENV_PAYMOB_API_KEY)s",
    PAYMOB_CARD_INTEGRATION_ID="%(ENV_PAYMOB_CARD_INTEGRATION_ID)s",
    PAYMOB_WALLET_INTEGRATION_ID="%(ENV_PAYMOB_WALLET_INTEGRATION_ID)s",
    PAYMOB_CARD_IFRAME_ID="%(ENV_PAYMOB_CARD_IFRAME_ID)s",
    PAYMOB_WALLET_IFRAME_ID="%(ENV_PAYMOB_WALLET_IFRAME_ID)s",
    BROADCAST_DRIVER="%(ENV_BROADCAST_DRIVER)s",
    CACHE_DRIVER="%(ENV_CACHE_DRIVER)s",
    FILESYSTEM_DISK="%(ENV_FILESYSTEM_DISK)s",
    QUEUE_CONNECTION="%(ENV_QUEUE_CONNECTION)s",
    SESSION_DRIVER="%(ENV_SESSION_DRIVER)s",
    SESSION_LIFETIME="%(ENV_SESSION_LIFETIME)s",
    MEMCACHED_HOST="%(ENV_MEMCACHED_HOST)s",
    REDIS_HOST="%(ENV_REDIS_HOST)s",
    REDIS_PASSWORD="%(ENV_REDIS_PASSWORD)s",
    REDIS_PORT="%(ENV_REDIS_PORT)s",
    MAIL_MAILER="%(ENV_MAIL_MAILER)s",
    MAIL_HOST="%(ENV_MAIL_HOST)s",
    MAIL_PORT="%(ENV_MAIL_PORT)s",
    MAIL_USERNAME="%(ENV_MAIL_USERNAME)s",
    MAIL_PASSWORD="%(ENV_MAIL_PASSWORD)s",
    MAIL_ENCRYPTION="%(ENV_MAIL_ENCRYPTION)s",
    MAIL_FROM_ADDRESS="%(ENV_MAIL_FROM_ADDRESS)s",
    MAIL_FROM_NAME="%(ENV_MAIL_FROM_NAME)s",
    TWILIO_SID="%(ENV_TWILIO_SID)s",
    TWILIO_TOKEN="%(ENV_TWILIO_TOKEN)s",
    TWILIO_FROM="%(ENV_TWILIO_FROM)s",
    AWS_ACCESS_KEY_ID="%(ENV_AWS_ACCESS_KEY_ID)s",
    AWS_SECRET_ACCESS_KEY="%(ENV_AWS_SECRET_ACCESS_KEY)s",
    AWS_DEFAULT_REGION="%(ENV_AWS_DEFAULT_REGION)s",
    AWS_BUCKET="%(ENV_AWS_BUCKET)s",
    AWS_URL="%(ENV_AWS_URL)s",
    FILEBASE_ACCESS_KEY="%(ENV_FILEBASE_ACCESS_KEY)s",
    FILEBASE_SECRET_KEY="%(ENV_FILEBASE_SECRET_KEY)s",
    FILEBASE_BUCKET="%(ENV_FILEBASE_BUCKET)s",
    FILEBASE_REGION="%(ENV_FILEBASE_REGION)s",
    FILEBASE_ENDPOINT="%(ENV_FILEBASE_ENDPOINT)s",
    PUSHER_APP_ID="%(ENV_PUSHER_APP_ID)s",
    PUSHER_APP_KEY="%(ENV_PUSHER_APP_KEY)s",
    PUSHER_APP_SECRET="%(ENV_PUSHER_APP_SECRET)s",
    PUSHER_HOST="%(ENV_PUSHER_HOST)s",
    PUSHER_PORT="%(ENV_PUSHER_PORT)s",
    PUSHER_SCHEME="%(ENV_PUSHER_SCHEME)s",
    PUSHER_APP_CLUSTER="%(ENV_PUSHER_APP_CLUSTER)s",
    VITE_APP_NAME="%(ENV_VITE_APP_NAME)s",
    VITE_PUSHER_APP_KEY="%(ENV_VITE_PUSHER_APP_KEY)s",
    VITE_PUSHER_HOST="%(ENV_VITE_PUSHER_HOST)s",
    VITE_PUSHER_PORT="%(ENV_VITE_PUSHER_PORT)s",
    VITE_PUSHER_SCHEME="%(ENV_VITE_PUSHER_SCHEME)s",
    VITE_PUSHER_APP_CLUSTER="%(ENV_VITE_PUSHER_APP_CLUSTER)s"

[program:mqtt-listener]
command=php artisan mqtt:subscribe "garage/spots/request_init"
directory=/app
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/mqtt.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
# Pass all required environment variables
environment=
    APP_ENV="%(ENV_APP_ENV)s",
    APP_DEBUG="%(ENV_APP_DEBUG)s",
    APP_KEY="%(ENV_APP_KEY)s",
    APP_NAME="%(ENV_APP_NAME)s",
    APP_URL="%(ENV_APP_URL)s",
    LOG_CHANNEL="%(ENV_LOG_CHANNEL)s",
    LOG_LEVEL="%(ENV_LOG_LEVEL)s",
    OCTANE_SERVER="%(ENV_OCTANE_SERVER)s",
    DB_CONNECTION="%(ENV_DB_CONNECTION)s",
    DB_HOST="%(ENV_DB_HOST)s",
    DB_PORT="%(ENV_DB_PORT)s",
    DB_DATABASE="%(ENV_DB_DATABASE)s",
    DB_USERNAME="%(ENV_DB_USERNAME)s",
    DB_PASSWORD="%(ENV_DB_PASSWORD)s",
    MQTT_HOST="%(ENV_MQTT_HOST)s",
    MQTT_PORT="%(ENV_MQTT_PORT)s",
    MQTT_CLIENT_ID="%(ENV_MQTT_CLIENT_ID)s",
    MQTT_CLIENT_SUBSCRIBER_ID="%(ENV_MQTT_CLIENT_SUBSCRIBER_ID)s",
    MQTT_USERNAME="%(ENV_MQTT_USERNAME)s",
    MQTT_PASSWORD="%(ENV_MQTT_PASSWORD)s",
    MQTT_KEEP_ALIVE="%(ENV_MQTT_KEEP_ALIVE)s",
    MQTT_CLEAN_START="%(ENV_MQTT_CLEAN_START)s",
    MQTT_TLS="%(ENV_MQTT_TLS)s",

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
